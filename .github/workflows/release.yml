name: Publish release 1.0.1
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-v1.0.1
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check successful source build
        run: |
          test "$(gh run view 41245374394 --json conclusion --jq .conclusion)" = success
          test "$(gh run view 41245374394 --json headSha --jq .headSha)" = d7c5905e684baf6c46fbdc3846e721b6272227f8
      - name: Load verified build artifact metadata
        run: gh api "repos/$GH_REPO/actions/runs/41245374394/artifacts" > artifacts.json
      - name: Verify and prepare release files
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import hashlib, json, os, subprocess, zipfile
          artifacts = [a for a in json.loads(Path('artifacts.json').read_text())['artifacts'] if a['name'].startswith('passwortgenerator-')]
          assert len(artifacts) == 4, artifacts
          dest = Path('release'); dest.mkdir()
          found = {}
          for a in artifacts:
              assert not a['expired'], a['name']
              expected = a['digest']
              assert expected and expected.startswith('sha256:'), a['name']
              archive = Path(str(a['id']) + '.zip')
              with archive.open('wb') as stream:
                  subprocess.run(['gh', 'api', 'repos/' + os.environ['GH_REPO'] + '/actions/artifacts/' + str(a['id']) + '/zip'], stdout=stream, check=True)
              actual = 'sha256:' + hashlib.sha256(archive.read_bytes()).hexdigest()
              assert actual == expected, a['name']
              with zipfile.ZipFile(archive) as z:
                  for item in z.infolist():
                      name = Path(item.filename.replace(chr(92), '/')).name
                      if not item.is_dir() and Path(name).suffix in {'.exe', '.msi', '.dmg', '.deb', '.AppImage'}:
                          assert name not in found, name
                          data = z.read(item)
                          (dest / name).write_bytes(data)
                          found[name] = hashlib.sha256(data).hexdigest()
              print('Verified:', a['name'], expected)
          assert len(found) == 6, found
          (dest / 'SHA256SUMS').write_text(''.join(found[n] + '  ' + n + '\n' for n in sorted(found)))
          PYCODE
      - name: Publish installers
        run: |
          cat > notes.md <<'NOTES'
          Herausgeber: **Karsten vom Wege** · Lizenz: **MIT**

          Passwortgenerator für Windows, macOS und Ubuntu.

          - Windows x64: `.exe` oder `.msi`
          - macOS Apple Silicon: `aarch64.dmg`
          - macOS Intel: `x64.dmg`
          - Ubuntu x64: `.deb` oder `.AppImage`

          Prüfsummen: `SHA256SUMS`. Alle vier Plattform-Builds und automatischen Tests sind erfolgreich.

          Windows ist nicht mit einem Entwicklerzertifikat signiert. macOS verwendet eine Ad-hoc-Signatur ohne Apple-Notarisierung. Manuelle Installationstests auf Windows/macOS stehen aus.
          NOTES
          gh release create v1.0.1 release/* --target d7c5905e684baf6c46fbdc3846e721b6272227f8 --title 'Passwortgenerator 1.0.1' --notes-file notes.md --latest
